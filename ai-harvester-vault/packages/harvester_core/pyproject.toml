[project]
name = "harvester-core"
version = "1.0.0"
description = "RedCoda Harvester Core — embeddable AI agent harvester and encrypted credential vault library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.3",
    "tenacity>=8.2.0",
    "playwright>=1.40.0",
    "crawl4ai>=0.4.0",
    "groq>=0.6.0",
    "google-generativeai>=0.5.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harvester_core"]

[tool.ruff]
line-length = 100
target-version = "py311"