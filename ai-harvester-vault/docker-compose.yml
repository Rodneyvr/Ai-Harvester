version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harvester-postgres
    environment:
      POSTGRES_DB: harvester
      POSTGRES_USER: harvester
      POSTGRES_PASSWORD: harvester_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvester -d harvester"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: harvester-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: harvester-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://harvester:harvester_dev@postgres:5432/harvester
      - REDIS_URL=redis://redis:6379/0
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data: