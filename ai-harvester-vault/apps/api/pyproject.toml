[project]
name = "harvester-api"
version = "0.1.0"
description = "Universal AI Skill & Agent Harvester API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "playwright>=1.40.0",
    "crawl4ai>=0.4.0",
    "groq>=0.6.0",
    "google-generativeai>=0.5.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=25.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=25.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "PL", "TRY", "SIM", "TID", "ARG", "ERA", "PD", "PGH", "PYI", "RSE", "RET", "SLF", "SLOT", "TCH", "INT", "PIE", "FLY", "NPY", "PT", "Q", "RUF", "T20", "W"]
ignore = ["E501", "S101"]
fixable = ["ALL"]
unfixable = ["T20", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]